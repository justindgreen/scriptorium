packages:
  - apps/*
  - packages/*
  - tools/*

# pnpm settings live here (pnpm 10+ reads them from this file, not from .npmrc).
# Only these dependencies may run build scripts.
allowBuilds:
  esbuild: true
  '@embedded-postgres/windows-x64': true
  '@embedded-postgres/linux-x64': true
  '@embedded-postgres/darwin-arm64': true

# Better Auth's adapter packages reference these drivers; we use only the Drizzle adapter on pg.
overrides:
  '@prisma/client': '-'
  better-sqlite3: '-'

# Peers are declared explicitly; never pull in optional drivers by accident.
autoInstallPeers: false

# corepack / pnpm-action already pin 12.14.0; do not re-download the binary during installs.
managePackageManagerVersions: false

# Tolerate a slow or flaky registry during installs (Docker builds, CI).
fetchRetries: 5
fetchRetryMintimeout: 20000
fetchRetryMaxtimeout: 120000
fetchTimeout: 120000
