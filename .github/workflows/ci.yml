name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: scriptorium
          POSTGRES_PASSWORD: scriptorium
          POSTGRES_DB: scriptorium_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U scriptorium"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # Integration tests run against the production major (spike S4); unit tests do not need it.
      DATABASE_URL: postgres://scriptorium:scriptorium@localhost:5432/scriptorium_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the application image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          push: false
          load: true
          tags: scriptorium:local
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Compose file is valid
        run: APP_SECRET=ci-secret-ci-secret-ci-secret-ci-secret docker compose -f deploy/docker/compose.yml config -q
      - name: Install smoke test (fresh stack, setup, backup, restart, restore)
        run: bash deploy/docker/smoke-test.sh
