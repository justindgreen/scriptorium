# Scriptorium with PostgreSQL 17. Copy .env.example to .env next to this file and set APP_SECRET.
#   docker compose -f deploy/docker/compose.yml up -d
services:
  app:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    image: scriptorium:local
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://scriptorium:${POSTGRES_PASSWORD:-change-me}@db:5432/scriptorium
      APP_SECRET: ${APP_SECRET:?set APP_SECRET to a random string of at least 32 characters}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3000}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      BACKUP_CRON: ${BACKUP_CRON:-}
      BACKUP_RETENTION: ${BACKUP_RETENTION:-14}
    ports:
      - '${PORT:-3000}:3000'
    volumes:
      - app-data:/data

  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: scriptorium
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: scriptorium
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U scriptorium -d scriptorium']
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  app-data:
  db-data:
